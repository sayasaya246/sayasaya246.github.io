<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 外部への通信を、ブラウザ側でも禁止する（画像は data: のみ） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>通勤チェッカー（公開デモ）</title>
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f8fafc; --card:#fff; --line:#e2e8f0; --text:#0f172a; --sub:#64748b; --mute:#94a3b8;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff6ff; --rose:#e11d48; --amber:#d97706; --green:#059669;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  line-height:1.5;min-height:100vh}
.wrap{max-width:28rem;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
header{padding:24px 0 14px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.logo{width:46px;height:46px;object-fit:contain;mix-blend-mode:multiply;animation:sway 5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
/* 背景：ターザン（文字の読みやすさのため、薄く・内容の後ろ・クリック不可） */
.bg{position:fixed;right:-6vw;bottom:-4vh;height:82vh;width:auto;max-width:90vw;object-fit:contain;opacity:.17;mix-blend-mode:multiply;transform:rotate(8deg);transform-origin:100% 100%;pointer-events:none;user-select:none;z-index:-1}
h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.03em;line-height:1.2}
.demo-badge{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:99px;background:#fef3c7;color:#92400e;font-size:10px;font-weight:800}
.clock{margin-top:8px;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.12em;display:flex;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px #0001;font-size:18px}
.icon-btn:active{transform:scale(.95)}
.title-row{display:flex;gap:12px;align-items:center}
.tabs{display:flex;background:#ffffff99;border:1px solid var(--line);border-radius:20px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:14px;font-size:14px;font-weight:700;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px #0002}
.card{background:#ffffffe6;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 1px 2px #0001;margin-bottom:12px}
.card h2{margin:0 0 14px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.14em}
.route{position:relative}
.stop{display:flex;gap:14px;margin-bottom:12px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:8px;flex:none}
.dot.a{background:var(--blue);box-shadow:0 0 0 4px #dbeafe}
.dot.b{background:var(--rose);box-shadow:0 0 0 4px #ffe4e6}
.stop label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:2px}
select,input[type=text],input[type=time]{font:inherit;color:var(--text)}
.stop select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:700;font-size:16px}
.stop .f{flex:1;padding-right:26px}
.swap{position:absolute;right:0;top:44px;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px #0002;font-size:18px;z-index:2}
.swap:active{transform:scale(.9) rotate(180deg)}
.modes{display:flex;gap:8px;margin-top:4px}
.modes button{flex:1;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--sub)}
.modes button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.go{width:100%;padding:18px;border-radius:24px;background:var(--blue);color:#fff;font-weight:900;font-size:18px;box-shadow:0 10px 20px #2563eb33;margin-bottom:12px}
.go:hover{background:var(--blue-d)}
.go:active{transform:scale(.97)}
.go:disabled{background:#fff;color:var(--mute);border:1px solid var(--line);box-shadow:none;cursor:not-allowed}
.loading{background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px 20px;text-align:center}
.bounce{width:104px;height:104px;object-fit:contain;mix-blend-mode:multiply;display:inline-block;animation:dance 1.2s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
.loading p{margin:12px 0 0;font-weight:700;color:var(--sub);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.bounce,.loading p,.logo{animation:none}}
.msg{background:#fff1f2;border:1px solid #ffe4e6;color:#9f1239;border-radius:24px;padding:18px;font-weight:700;font-size:14px;margin-bottom:12px}
.dark{background:#0f172a;color:#fff;border-radius:28px;padding:16px;margin-bottom:8px;box-shadow:0 12px 24px #0f172a33}
.dark .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.dark .tg{font-size:10px;font-weight:900;letter-spacing:.14em;color:#94a3b8}
.dark .tg b{color:#3b82f6;margin-left:6px}
.sw{padding:6px 10px;border-radius:10px;background:#3b82f633;border:1px solid #3b82f64d;color:#60a5fa;font-size:11px;font-weight:900}
.dark .lv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dark .lv span{font-size:14px;font-weight:700;color:#cbd5e1}
.dark .lv strong{font-size:44px;font-weight:900;letter-spacing:-.04em;color:#60a5fa;line-height:1.1}
.dark .note{margin:8px 0 0;padding-top:8px;border-top:1px solid #ffffff1a;font-size:12px;font-weight:700;color:#94a3b8}
.dark .note em{font-style:normal;color:#fff;background:#3b82f680;padding:1px 6px;border-radius:8px}
.mini{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 16px;margin-bottom:8px}
.mini .k{font-size:10px;font-weight:700;color:#64748b;letter-spacing:.1em}
.mini .v{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.mini .v strong{font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:1.15}
.mini .v span{font-weight:700;color:var(--sub)}
.diff{margin-left:8px;font-size:11px;font-weight:800}
.up{color:var(--rose)} .down{color:var(--green)} .flat{color:var(--mute)}
.box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px 16px;margin-bottom:8px}
.box h4{margin:0 0 8px;font-size:10px;font-weight:900;color:var(--mute);letter-spacing:.14em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc{background:var(--bg);border:1px solid #f1f5f9;border-radius:16px;padding:8px 12px}
.fc .t{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--sub)}
.fc .n{font-size:22px;font-weight:900}
.fc .n small{font-size:10px;color:var(--sub);margin-left:3px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmp button{background:var(--bg);border:2px solid #f1f5f9;border-radius:16px;padding:8px 4px;text-align:center}
.cmp button.on{border-color:var(--blue);background:var(--blue-l)}
.cmp .m{font-size:12px;font-weight:800}
.cmp .n{font-size:20px;font-weight:900}
.cmp .n small{font-size:10px;color:var(--sub)}
.cmp .l{font-size:10px;color:var(--sub);font-weight:700}
.pt{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--bg);border:1px solid #f1f5f9;margin-bottom:8px}
.pt .d{width:10px;height:10px;border-radius:50%;flex:none}
.pt .d.smooth{background:#3b82f6;box-shadow:0 0 8px #3b82f680}
.pt .d.busy{background:#f59e0b;box-shadow:0 0 8px #f59e0b80}
.pt .d.jam{background:#f43f5e;box-shadow:0 0 8px #f43f5e80}
.pt .x{flex:1;font-size:12px;font-weight:700}
.pt .x small{display:block;font-size:10px;color:var(--sub);font-weight:500}
.tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:900}
.tag.smooth{background:#dbeafe;color:#1d4ed8}.tag.busy{background:#fef3c7;color:#b45309}.tag.jam{background:#ffe4e6;color:#be123c}
footer{text-align:center;padding:20px 0 40px;font-size:10px;font-weight:700;color:var(--sub);line-height:1.8}
footer .priv{color:var(--text)}
/* 設定画面 */
.overlay{position:fixed;inset:0;background:#0f172a66;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.sheet{width:100%;max-width:28rem;max-height:92vh;overflow:auto;background:#fff;border-radius:32px;padding:24px;box-shadow:0 20px 50px #0004}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sheet h2{margin:0;font-size:22px;font-weight:900}
.x-btn{width:44px;height:44px;border-radius:50%;font-size:20px;color:var(--mute)}
.x-btn:hover{background:#f1f5f9}
.stabs{display:flex;background:#f1f5f9;padding:4px;border-radius:16px;margin-bottom:18px}
.stabs button{flex:1;padding:10px;border-radius:12px;font-size:12px;font-weight:900;color:var(--sub)}
.stabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px #0002}
.fld{margin-bottom:16px}
.fld > label{display:block;font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.1em;margin-bottom:6px}
.fld input[type=text],.fld select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#f8fafc;font-size:16px;font-weight:600}
.sub-fld{display:grid;grid-template-columns:1fr;gap:8px}
.timeopt{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--blue);background:var(--blue)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.tbox{flex:1;border:2px solid #f1f5f9;border-radius:22px;padding:12px 16px;cursor:pointer}
.tbox.on{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-l)}
.tbox .lb{font-size:10px;font-weight:900;color:var(--mute);letter-spacing:.1em}
.tbox.on .lb{color:var(--blue)}
.tbox input{width:100%;border:0;background:transparent;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;outline:none}
.info{background:var(--blue-l);border:1px solid #dbeafe;border-radius:22px;padding:14px;text-align:center;font-size:12px;color:var(--sub);margin-bottom:16px}
.info b{display:block;color:var(--text);font-size:13px;margin-bottom:4px}
.save{width:100%;padding:16px;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 16px #2563eb2e}
.reset{width:100%;padding:12px;font-size:12px;font-weight:700;color:var(--mute);margin-top:6px}
.reset:hover{color:var(--rose)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<img class="bg" id="bgImg" alt="" aria-hidden="true">
<noscript><div style="margin:16px;padding:16px;border-radius:16px;background:#fef3c7;color:#92400e;font-weight:700;font-size:14px;line-height:1.6">このデモは、プログラムを動かせるブラウザで開いてください（Chrome・Safari など）。ドライブのプレビュー画面では、動きません。</div></noscript>
<header><div class="wrap">
  <div class="head">
    <div>
      <div class="title-row">
        <img class="logo" id="logoImg" alt="" aria-hidden="true">
        <div>
          <h1 id="title">通勤チェッカー</h1>
          <span class="demo-badge">公開デモ版</span>
        </div>
      </div>
      <div class="clock"><span id="clkDate"></span><span id="clkTime"></span></div>
    </div>
    <button class="icon-btn" id="openSet" aria-label="設定を開く">⚙</button>
  </div>
</div></header>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="出発地の切り替え">
    <button id="tabHome" role="tab">🏠 <span id="tabHomeL">自宅</span>から</button>
    <button id="tabWork" role="tab">🏢 <span id="tabWorkL">勤務先</span>から</button>
  </div>

  <section class="card">
    <h2>ルート詳細</h2>
    <div class="route">
      <button class="swap" id="swap" aria-label="出発と到着を入れ替え" title="出発と到着を入れ替え">⇅</button>
      <div class="stop"><div class="dot a"></div><div class="f"><label for="selFrom">出発</label><select id="selFrom"></select></div></div>
      <div class="stop"><div class="dot b"></div><div class="f"><label for="selTo">到着</label><select id="selTo"></select></div></div>
    </div>
    <div class="modes" role="group" aria-label="交通手段">
      <button data-m="car">🚗 車</button>
      <button data-m="bike">🚲 自転車</button>
      <button data-m="walk">🚶 徒歩</button>
    </div>
  </section>

  <button class="go" id="go">混雑状況を確認する</button>
  <div id="out" aria-live="polite"></div>
</main>

<footer><div class="wrap">
  <p class="priv">これは公開デモ版です。所要時間は、サンプル地点ごとの固定データ（目安）で、実際の道路状況とは異なります。<br>
  通信は一切行いません。入力した内容は、この端末のブラウザ内にだけ保存されます。</p>
  <p>サンプル地点は一般的な駅・公共施設の名前です。</p>
</div></footer>

<!-- 設定画面 -->
<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="hd"><h2 id="setTitle">アプリ設定</h2><button class="x-btn" id="closeSet" aria-label="閉じる">✕</button></div>
    <div class="stabs">
      <button id="stA" class="on">📍 住所設定</button>
      <button id="stT">🕐 時間設定</button>
    </div>
    <form id="form">
      <div id="pAddr">
        <div class="fld"><label for="fName">お名前</label><input type="text" id="fName" maxlength="20" placeholder="例: ゲスト" autocomplete="off"></div>
        <div class="fld"><label for="fHomeL">🏠 自宅の呼び名</label>
          <div class="sub-fld"><input type="text" id="fHomeL" maxlength="10" placeholder="例: 自宅" autocomplete="off">
          <select id="fHomeS" aria-label="自宅の場所"></select></div></div>
        <div class="fld"><label for="fWorkL">🏢 勤務先の呼び名</label>
          <div class="sub-fld"><input type="text" id="fWorkL" maxlength="10" placeholder="例: 勤務先" autocomplete="off">
          <select id="fWorkS" aria-label="勤務先の場所"></select></div></div>
        <p style="font-size:11px;color:var(--sub);margin:0 0 16px">デモ版のため、住所は自由に入力できません。サンプル地点から選びます。</p>
      </div>
      <div id="pTime" style="display:none">
        <div class="info"><b>目標到着時刻の使い分け</b>「通常」と「夏休み・予備」の2つを設定できます。<br>どちらか一方を選んで使います。</div>
        <div class="timeopt"><button type="button" class="radio" id="rN" aria-label="通常を使う"></button>
          <div class="tbox" id="bN"><div class="lb">通常スケジュール</div><input type="time" id="fTN" aria-label="通常の到着時刻"></div></div>
        <div class="timeopt"><button type="button" class="radio" id="rF" aria-label="夏休みを使う"></button>
          <div class="tbox" id="bF"><div class="lb">夏休みの出社時など</div><input type="time" id="fTF" aria-label="夏休みの到着時刻"></div></div>
      </div>
      <button type="submit" class="save">設定をすべて保存する</button>
      <button type="button" class="reset" id="reset">設定をすべてリセット</button>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ===== 固定データ（デモ用の目安。実測ではない） ===== */
const DATA = {"spots":[{"id":"shizuoka","name":"静岡駅"},{"id":"shinshizuoka","name":"新静岡駅"},{"id":"shiyakusho","name":"静岡市役所"},{"id":"kencho","name":"静岡県庁"},{"id":"sunpu","name":"駿府城公園"},{"id":"kusanagi","name":"草薙駅"},{"id":"higashishizuoka","name":"東静岡駅"},{"id":"shimizu","name":"清水駅"}],"pairs":{"shizuoka|shinshizuoka":{"km":0.6,"car":4,"bike":3,"walk":7,"rush":1},"shizuoka|shiyakusho":{"km":1.1,"car":5,"bike":5,"walk":13,"rush":1},"shizuoka|kencho":{"km":0.8,"car":5,"bike":4,"walk":10,"rush":1},"shizuoka|sunpu":{"km":1.1,"car":6,"bike":5,"walk":14,"rush":1},"shizuoka|kusanagi":{"km":3.1,"car":10,"bike":13,"walk":38,"rush":1},"shizuoka|higashishizuoka":{"km":4.6,"car":14,"bike":20,"walk":57,"rush":1},"shizuoka|shimizu":{"km":12.8,"car":33,"bike":55,"walk":160,"rush":1.3},"shinshizuoka|shiyakusho":{"km":0.5,"car":4,"bike":3,"walk":7,"rush":1},"shinshizuoka|kencho":{"km":0.6,"car":4,"bike":3,"walk":7,"rush":1},"shinshizuoka|sunpu":{"km":0.7,"car":5,"bike":3,"walk":9,"rush":1},"shinshizuoka|kusanagi":{"km":3.5,"car":11,"bike":15,"walk":44,"rush":1},"shinshizuoka|higashishizuoka":{"km":5.1,"car":15,"bike":22,"walk":64,"rush":1.3},"shinshizuoka|shimizu":{"km":13.2,"car":33,"bike":57,"walk":165,"rush":1.3},"shiyakusho|kencho":{"km":0.5,"car":4,"bike":3,"walk":6,"rush":1},"shiyakusho|sunpu":{"km":0.3,"car":4,"bike":3,"walk":4,"rush":1},"shiyakusho|kusanagi":{"km":3.7,"car":11,"bike":16,"walk":46,"rush":1},"shiyakusho|higashishizuoka":{"km":5.4,"car":15,"bike":23,"walk":67,"rush":1.3},"shiyakusho|shimizu":{"km":13.3,"car":34,"bike":57,"walk":166,"rush":1.3},"kencho|sunpu":{"km":0.4,"car":4,"bike":3,"walk":5,"rush":1},"kencho|kusanagi":{"km":3.2,"car":10,"bike":14,"walk":40,"rush":1},"kencho|higashishizuoka":{"km":4.9,"car":14,"bike":21,"walk":61,"rush":1},"kencho|shimizu":{"km":12.8,"car":33,"bike":55,"walk":161,"rush":1.3},"sunpu|kusanagi":{"km":3.5,"car":11,"bike":15,"walk":44,"rush":1},"sunpu|higashishizuoka":{"km":5.2,"car":15,"bike":22,"walk":65,"rush":1.3},"sunpu|shimiz /* ===== 初期値（サンプル。本人の実住所は入れない） ===== */
const DEFAULTS = {name:"ゲスト", homeL:"自宅", homeS:"kusanagi", workL:"勤務先", workS:"shiyakusho",
                  tN:"07:30", tF:"08:30", tKey:"normal", mode:"car"};
const KEY = "commute_demo_settings_v1";
const MODE_NAME = {car:"車", bike:"自転車", walk:"徒歩"};
const MODE_ICON = {car:"🚗", bike:"🚲", walk:"🚶"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const spotName = id => (DATA.spots.find(s => s.id === id) || {}).name || "";

/* 保存（ブラウザ内のみ。使えない環境でも動く） */
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return Object.assign({}, DEFAULTS, JSON.parse(r)); }catch(e){}
  return Object.assign({}, DEFAULTS);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const S = load();
// 壊れた保存値の防御
if(!DATA.spots.some(s=>s.id===S.homeS)) S.homeS = DEFAULTS.homeS;
if(!DATA.spots.some(s=>s.id===S.workS)) S.workS = DEFAULTS.workS;
if(!MODE_NAME[S.mode]) S.mode = "car";
if(!/^\d\d:\d\d$/.test(S.tN)) S.tN = DEFAULTS.tN;
if(!/^\d\d:\d\d$/.test(S.tF)) S.tF = DEFAULTS.tF;
let from = S.homeS, to = S.workS, shown = false, timer = null;

/* ===== 時刻の道具 ===== */
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const fmt = m => { m = ((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const targetStr = () => S.tKey === "normal" ? S.tN : S.tF;

/* ===== 計算 ===== */
function pair(a,b){
  const ia = DATA.spots.findIndex(s=>s.id===a), ib = DATA.spots.findIndex(s=>s.id===b);
  const k = ia < ib ? a+"|"+b : b+"|"+a;
  return DATA.pairs[k];
}
/* 朝・夕の混雑の強さ（固定の時間帯表。出発時刻で決まる） */
const RUSH = [[300,1.00],[360,1.05],[390,1.15],[420,1.30],[450,1.45],[480,1.50],[510,1.35],[540,1.15],[570,1.05],
              [990,1.30],[1080,1.30],[1140,1.10],[1200,1.00]];
function rushAt(m){
  m = ((Math.round(m)%1440)+1440)%1440;
  let v = 1.00;
  for(const [t,f] of RUSH){ if(m >= t) v = f; }
  if(m >= 570 && m < 990) v = 1.05;       // 日中
  if(m >= 1200 || m < 300) v = 1.00;      // 夜間
  return v;
}
function minutes(p, mode, dep){
  if(mode !== "car") return p[mode];
  return Math.round(p.car * (1 + (rushAt(dep)-1) * p.rush));
}
/* 着きたい時刻から、出発時刻を逆算する（車は、出発時刻で所要時間が変わるので探す） */
function leaveFor(p, mode, target){
  if(mode !== "car") return target - p[mode];
  for(let dep = target - 1; dep > target - 360; dep--){
    if(dep + minutes(p,"car",dep) <= target) return dep;
  }
  return target - p.car;
}
function status(f){ return f >= 1.30 ? "jam" : f >= 1.12 ? "busy" : "smooth"; }
const STATUS_TXT = {smooth:"順調", busy:"混雑", jam:"渋滞"};

/* ===== 画面 ===== */
function fillSelect(sel, val){
  sel.innerHTML = DATA.spots.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  sel.value = val;
}
function renderTabs(){
  $("tabHomeL").textContent = S.homeL || "自宅";
  $("tabWorkL").textContent = S.workL || "勤務先";
  const hOn = from === S.homeS, wOn = from === S.workS;
  $("tabHome").className = hOn ? "on" : ""; $("tabWork").className = (!hOn && wOn) ? "on" : "";
  $("tabHome").setAttribute("aria-selected", hOn); $("tabWork").setAttribute("aria-selected", !hOn && wOn);
  document.querySelectorAll(".modes button").forEach(b => b.className = b.dataset.m === S.mode ? "on" : "");
  $("title").textContent = (S.name ? S.name + " さんの" : "") + "通勤チェッカー";
  $("go").disabled = false;
}
function setRoute(a,b){ from=a; to=b; $("selFrom").value=a; $("selTo").value=b; renderTabs(); if(shown) calc(); }

function arrow(cls){ return cls==="up" ? "▲" : cls==="down" ? "▼" : "―"; }
function result(){
  const p = pair(from,to);
  if(from === to) return `<div class="msg">出発と到着が同じ場所です。別の場所を選んでください。</div>`;
  const mode = S.mode, target = toMin(targetStr());
  const dep = leaveFor(p, mode, target), est = minutes(p, mode, dep);
  const toName = spotName(to);
  let h = `<div class="dark"><div class="top">
      <div class="tg">到着目標: ${esc(targetStr())}<b>(${S.tKey==="normal"?"通常":"夏休み等"})</b></div>
      <button class="sw" id="swTime">時間を切替</button></div>
    <div class="lv"><span>${from===S.homeS?"までに家を出て！":"までに出発！"}</span><strong>${fmt(dep)}</strong></div>
    <p class="note">${esc(toName)} 必達。目標到着 <em>${esc(targetStr())}</em>。</p></div>`;

  let diff = "";
  if(mode === "car" && est !== p.car){
    diff = est > p.car ? `<span class="diff up">▲ +${est-p.car}分</span>` : `<span class="diff down">▼ -${p.car-est}分</span>`;
  }
  h += `<div class="mini"><div class="k">現在の予想所要時間（${MODE_ICON[mode]} ${MODE_NAME[mode]}${mode==="car"?"・通常 "+p.car+"分":""}）</div>
    <div class="v"><strong>${est}</strong><span>min</span>${diff}</div></div>`;

  if(mode === "car"){
    const fc = [15,30].map(d => {
      const m = minutes(p,"car",dep+d), t = m > est ? "up" : m < est ? "down" : "flat";
      return `<div class="fc"><div class="t"><span>出発が${d}分遅れると</span><span class="${t}">${arrow(t)}</span></div>
        <div class="n">${m}<small>min</small></div></div>`;
    }).join("");
    h += `<div class="box"><h4>時間差の渋滞予報</h4><div class="grid2">${fc}</div></div>`;
  }

  // 3つの手段を並べて比べる（押すと切り替わる）
  const cmp = ["car","bike","walk"].map(m => {
    const d = leaveFor(p,m,target), e = minutes(p,m,d);
    return `<button data-cm="${m}" class="${m===mode?"on":""}"><div class="m">${MODE_ICON[m]} ${MODE_NAME[m]}</div>
      <div class="n">${e}<small>min</small></div><div class="l">${fmt(d)} 出発</div></button>`;
  }).join("");
  h += `<div class="box"><h4>交通手段くらべ</h4><div class="cmp">${cmp}</div></div>`;

  if(mode === "car"){
    const f = rushAt(dep), st = status(f);
    const pts = p.km >= 5
      ? [["国道1号（バイパス）付近", st], ["市街地の幹線道路", f>=1.12?"busy":"smooth"], [toName+" 周辺", f>=1.40?"busy":"smooth"]]
      : [[spotName(from)+" 周辺", f>=1.40?"busy":"smooth"], [toName+" 周辺", f>=1.40?"busy":"smooth"]];
    const reason = {smooth:"流れは順調です", busy:"交通量が増える時間帯です", jam:"朝のラッシュで混みやすい時間帯です"};
    h += `<div class="box"><h4>ルート詳細（主要地点）</h4>${pts.map(([n,s]) =>
      `<div class="pt"><div class="d ${s}"></div><div class="x">${esc(n)}<small>${reason[s]}（デモ用の固定データ）</small></div>
       <div class="tag ${s}">${STATUS_TXT[s]}</div></div>`).join("")}</div>`;
  }
  return h;
}
function bindResult(){
  const sw = $("swTime");
  if(sw) sw.onclick = () => { S.tKey = S.tKey==="normal" ? "free" : "normal"; save(); calc(); };
  document.querySelectorAll("[data-cm]").forEach(b => b.onclick = () => { S.mode = b.dataset.cm; save(); renderTabs(); calc(); });
}
function calc(){ $("out").innerHTML = result(); bindResult(); shown = true; }

/* 「調べてます」の演出（通信はしない。短い待ち時間だけ） */
function check(){
  if(timer) return;
  const msgs = ["調べてます","間違いがないよう冷静に調べてます。","もう少しです。"];
  let i = 0; $("go").disabled = true;
  $("out").innerHTML = `<div class="loading"><img class="bounce" alt="" aria-hidden="true" src="${IMG_ROBO}"><p id="lmsg">${msgs[0]}</p></div>`;
  timer = setInterval(() => { i++; const e = $("lmsg"); if(e && i < msgs.length) e.textContent = msgs[i]; }, 600);
  setTimeout(() => { clearInterval(timer); timer = null; $("go").disabled = false; calc(); }, 1500);
}

/* ===== 設定画面 ===== */
function openSet(){
  $("fName").value = S.name; $("fHomeL").value = S.homeL; $("fWorkL").value = S.workL;
  fillSelect($("fHomeS"), S.homeS); fillSelect($("fWorkS"), S.workS);
  $("fTN").value = S.tN; $("fTF").value = S.tF; paintRadio(S.tKey);
  setTab("a"); $("overlay").classList.add("open"); $("fName").focus();
}
function closeSet(){ $("overlay").classList.remove("open"); $("openSet").focus(); }
function setTab(t){ $("pAddr").style.display = t==="a"?"":"none"; $("pTime").style.display = t==="t"?"":"none";
  $("stA").className = t==="a"?"on":""; $("stT").className = t==="t"?"on":""; }
let tmpKey = "normal";
function paintRadio(k){ tmpKey = k; $("rN").className = "radio"+(k==="normal"?" on":""); $("rF").className = "radio"+(k==="free"?" on":"");
  $("bN").className = "tbox"+(k==="normal"?" on":""); $("bF").className = "tbox"+(k==="free"?" on":""); }
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"), 1800); }

/* ===== イベント ===== */
fillSelect($("selFrom"), from); fillSelect($("selTo"), to);
$("selFrom").onchange = e => setRoute(e.target.value, to);
$("selTo").onchange = e => setRoute(from, e.target.value);
$("swap").onclick = () => setRoute(to, from);
$("tabHome").onclick = () => setRoute(S.homeS, from === S.homeS ? S.workS : (to === S.homeS ? S.workS : to));
$("tabWork").onclick = () => setRoute(S.workS, from === S.workS ? S.homeS : (to === S.workS ? S.homeS : to));
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => { S.mode = b.dataset.m; save(); renderTabs(); if(shown) calc(); });
$("go").onclick = check;
$("openSet").onclick = openSet; $("closeSet").onclick = closeSet;
$("overlay").addEventListener("click", e => { if(e.target === $("overlay")) closeSet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("overlay").classList.contains("open")) closeSet(); });
$("stA").onclick = () => setTab("a"); $("stT").onclick = () => setTab("t");
$("rN").onclick = $("bN").onclick = () => paintRadio("normal");
$("rF").onclick = $("bF").onclick = () => paintRadio("free");
$("fTN").onclick = e => e.stopPropagation(); $("fTF").onclick = e => e.stopPropagation();
$("form").onsubmit = e => {
  e.preventDefault();
  S.name = $("fName").value.trim(); S.homeL = $("fHomeL").value.trim() || "自宅"; S.workL = $("fWorkL").value.trim() || "勤務先";
  S.homeS = $("fHomeS").value; S.workS = $("fWorkS").value;
  S.tN = $("fTN").value || DEFAULTS.tN; S.tF = $("fTF").value || DEFAULTS.tF; S.tKey = tmpKey;
  save(); closeSet(); setRoute(S.homeS, S.workS); toast("設定を保存しました");
};
$("reset").onclick = () => {
  if(!window.confirm("すべての設定（名前・場所・時間）を初期値に戻してもよろしいですか？")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  Object.assign(S, DEFAULTS); closeSet(); setRoute(S.homeS, S.workS); $("out").innerHTML = ""; shown = false; toast("初期値に戻しました");
};

/* 時計 */
function tick(){
  const d = new Date();
  $("clkDate").textContent = d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
  $("clkTime").textContent = d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}
tick(); setInterval(tick, 1000);
$("bgImg").src = IMG_BG; $("logoImg").src = IMG_ROBO;
renderTabs();
</script>
</body>
</html>
